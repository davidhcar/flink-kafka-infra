name: CI Flinkflow Pipeline Test & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Unit Tests, Schema Validation & Artifact Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml requests

      - name: Run Modular OMOP Pipeline Unit Tests
        run: |
          pytest flinkflow-jobs/hybrid/omop/tests/ -v

      - name: Validate Confluent Schema Registry Contracts
        run: |
          python scripts/register_schemas.py --help

      - name: Compile Modular DAG into Production Deployment Artifact
        run: |
          mkdir -p dist/
          python scripts/render_pipeline.py \
            flinkflow-jobs/hybrid/omop/omop-ai-cdss-agent.yaml \
            dist/omop-ai-cdss-agent.yaml

      - name: Verify Compiled YAML Artifact
        run: |
          python -c "import yaml; doc = yaml.safe_load(open('dist/omop-ai-cdss-agent.yaml')); assert len(doc['steps']) == 9; print('SUCCESS: Validated 9 steps in compiled production YAML artifact')"

      - name: Upload Compiled Pipeline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flinkflow-production-pipeline
          path: dist/omop-ai-cdss-agent.yaml
