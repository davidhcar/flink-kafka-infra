services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_METADATA_LOG_DIRS_CLEANUP_ENABLE: 'true'
      KAFKA_FORMAT_STORAGE_DIRS_ON_STARTUP: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data

  postgres:
    image: postgres:16
    hostname: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: outbox_demo
      # Set wal_level to logical to support logical decoding for Debezium
#      POSTGRES_INITDB_ARGS: "--wal_level=logical"
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    hostname: schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8084:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1

  # Debezium Kafka Connect
  kafka-connect:
    image: debezium/connect:2.5
    hostname: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /kafka/connect

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

  ff-jobmanager:
    image: ghcr.io/talwegai/flinkflow:latest
    hostname: ff-jobmanager
    container_name: ff-jobmanager
    ports:
      - "8081:8081"
    env_file:
      - path: ../env.local
        required: false
    environment:
      - JOB_MANAGER_RPC_ADDRESS=ff-jobmanager
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - SCHEMA_REGISTRY_URL=${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      - POSTGRES_URL=${POSTGRES_URL:-jdbc:postgresql://postgres:5432/outbox_demo}
      - VOCAB_SERVICE_URL=${VOCAB_SERVICE_URL:-http://vocab-service:8082}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.0-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FLUSS_COORDINATOR_SERVER=${FLUSS_COORDINATOR_SERVER:-fluss-coordinator:9123}
      - |
        FLINK_PROPERTIES=
        state.backend.type: rocksdb
        state.backend.incremental: true
        state.checkpoints.dir: file:///opt/flink/state/checkpoints
        state.savepoints.dir: file:///opt/flink/state/savepoints
        execution.checkpointing.interval: 10000
        execution.checkpointing.min-pause: 5000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    volumes:
      - ../flinkflow-jobs:/opt/flink/flinkflow-jobs:ro
      - flink-state:/opt/flink/state
    command: jobmanager

  ff-taskmanager:
    image: ghcr.io/talwegai/flinkflow:latest
    hostname: ff-taskmanager
    container_name: ff-taskmanager
    depends_on:
      - ff-jobmanager
    env_file:
      - path: ../env.local
        required: false
    environment:
      - JOB_MANAGER_RPC_ADDRESS=ff-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - SCHEMA_REGISTRY_URL=${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      - POSTGRES_URL=${POSTGRES_URL:-jdbc:postgresql://postgres:5432/outbox_demo}
      - VOCAB_SERVICE_URL=${VOCAB_SERVICE_URL:-http://vocab-service:8082}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.0-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FLUSS_COORDINATOR_SERVER=${FLUSS_COORDINATOR_SERVER:-fluss-coordinator:9123}
      - |
        FLINK_PROPERTIES=
        state.backend.type: rocksdb
        state.backend.incremental: true
        state.checkpoints.dir: file:///opt/flink/state/checkpoints
        state.savepoints.dir: file:///opt/flink/state/savepoints
        execution.checkpointing.interval: 10000
        execution.checkpointing.min-pause: 5000
        execution.checkpointing.mode: EXACTLY_ONCE
    volumes:
      - ../flinkflow-jobs:/opt/flink/flinkflow-jobs:ro
      - flink-state:/opt/flink/state
    command: taskmanager

  vocab-service:
    image: python:3.11-slim
    hostname: vocab-service
    container_name: vocab-service
    ports:
      - "8082:8082"
    volumes:
      - ../flinkflow-jobs/hybrid/omop:/app

    command: python /app/vocab_service.py 8082
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8082/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  fluss-zookeeper:
    image: zookeeper:3.9.2
    hostname: fluss-zookeeper
    container_name: fluss-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=fluss-zookeeper:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: mntr, conf, ruok

  fluss-coordinator:
    image: apache/fluss:0.9.1-incubating
    hostname: fluss-coordinator
    container_name: fluss-coordinator
    command: coordinatorServer
    depends_on:
      - fluss-zookeeper
    ports:
      - "9123:9123"
    environment:
      - |
        FLUSS_PROPERTIES=
        zookeeper.address: fluss-zookeeper:2181
        bind.listeners: INTERNAL://fluss-coordinator:0, CLIENT://fluss-coordinator:9123
        advertised.listeners: CLIENT://localhost:9123
        internal.listener.name: INTERNAL
    volumes:
      - fluss-coord-data:/opt/fluss/data

  fluss-tabletserver:
    image: apache/fluss:0.9.1-incubating
    hostname: fluss-tabletserver
    container_name: fluss-tabletserver
    command: tabletServer
    depends_on:
      - fluss-coordinator
    ports:
      - "9124:9124"
    environment:
      - |
        FLUSS_PROPERTIES=
        zookeeper.address: fluss-zookeeper:2181
        bind.listeners: INTERNAL://fluss-tabletserver:0, CLIENT://fluss-tabletserver:9124
        advertised.listeners: CLIENT://localhost:9124
        internal.listener.name: INTERNAL
        tablet-server.id: 1
    volumes:
      - fluss-data:/opt/fluss/data

  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    container_name: clickhouse
    user: "101:101"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=langfuse_password
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  minio:
    image: minio/minio:latest
    container_name: minio
    entrypoint: sh -c 'mkdir -p /data/langfuse && exec minio server /data --console-address ":9001"'
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - minio_data:/data

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  langfuse:
    image: langfuse/langfuse:4
    container_name: langfuse
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:4000
      - NEXTAUTH_SECRET=my_super_secret_nextauth_key_change_me
      - SALT=my_super_secret_salt_key_change_me
      # Postgres Database URL
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/outbox_demo
      # ClickHouse Integration
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=langfuse_password
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_ENABLE_CLICKHOUSE=true
      # Redis Connection
      - REDIS_CONNECTION_STRING=redis://redis:6379
      # S3/MinIO Integration for Raw Events
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=minioadminpassword
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_LOG_LEVEL=debug
      - LOG_LEVEL=debug

  langfuse-worker:
    image: langfuse/langfuse-worker:4
    container_name: langfuse-worker
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:4000
      - NEXTAUTH_SECRET=my_super_secret_nextauth_key_change_me
      - SALT=my_super_secret_salt_key_change_me
      # Postgres Database URL
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/outbox_demo
      # ClickHouse Integration
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=langfuse_password
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_ENABLE_CLICKHOUSE=true
      # Redis Connection
      - REDIS_CONNECTION_STRING=redis://redis:6379
      # S3/MinIO Integration for Raw Events
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=minioadminpassword
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_LOG_LEVEL=debug
      - LOG_LEVEL=debug


volumes:
  kafka-data:
  postgres-data:
  clickhouse_data:
  minio_data:
  flink-state:
  fluss-coord-data:
  fluss-data:

