# -----------------------------------------------------------------------------
# SCHEMA REGISTRY UTILITIES
# -----------------------------------------------------------------------------

[tasks."schema:register:all"]
description = "Automatically discover and register all schemas in schemas/ directory with Schema Registry"
run = "python3 scripts/register_schemas.py 2>/dev/null || python scripts/register_schemas.py || py scripts/register_schemas.py"

[tasks."schema:register"]
description = "Register a specific schema file or pattern (e.g. mise run schema:register 'omop*')"
usage = 'arg "<target>" help="Schema file path or pattern in schemas/"'
run = 'python3 scripts/register_schemas.py "$usage_target" 2>/dev/null || python scripts/register_schemas.py "$usage_target" || py scripts/register_schemas.py "$usage_target"'

[tasks."schema:register:omop"]
description = "Register OMOP event and alert schemas with Confluent Schema Registry"
run = 'mise run schema:register "omop*"'

[tasks."schema:list"]
description = "List all registered subjects from Confluent Schema Registry"
run = "curl -s ${SCHEMA_REGISTRY_URL_LOCAL:-http://localhost:8084}/subjects | jq . 2>/dev/null || curl -s ${SCHEMA_REGISTRY_URL_LOCAL:-http://localhost:8084}/subjects"

# -----------------------------------------------------------------------------
# OHDSI OMOP DEMO HELPER ALIASES
# -----------------------------------------------------------------------------

[tasks."kafka:reset:omop"]
description = "Purge and recreate Kafka topics omop-standard-events, omop-clinical-alerts, and omop-cdss-ai-alerts"
run = '''
docker compose -f docker/docker-compose.yml exec -T kafka sh -c '
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --delete --topic ${OMOP_EVENTS_TOPIC:-omop-standard-events} 2>/dev/null || true
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --delete --topic ${OMOP_ALERTS_TOPIC:-omop-clinical-alerts} 2>/dev/null || true
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --delete --topic ${OMOP_AI_ALERTS_TOPIC:-omop-cdss-ai-alerts} 2>/dev/null || true
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --create --topic ${OMOP_EVENTS_TOPIC:-omop-standard-events} --partitions 1 --replication-factor 1 2>/dev/null || true
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --create --topic ${OMOP_ALERTS_TOPIC:-omop-clinical-alerts} --partitions 1 --replication-factor 1 2>/dev/null || true
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --create --topic ${OMOP_AI_ALERTS_TOPIC:-omop-cdss-ai-alerts} --partitions 1 --replication-factor 1 2>/dev/null || true
'
'''

[tasks."omop:consume:alerts"]
description = "Stream live clinical alerts directly from Kafka topic omop-clinical-alerts"
run = "docker compose -f docker/docker-compose.yml exec -T kafka kafka-console-consumer --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --topic ${OMOP_ALERTS_TOPIC:-omop-clinical-alerts}"

[tasks."omop:consume:ai-alerts"]
description = "Stream live AI CDSS diagnostic alerts directly from Kafka topic omop-cdss-ai-alerts"
run = "docker compose -f docker/docker-compose.yml exec -T kafka kafka-console-consumer --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --topic ${OMOP_AI_ALERTS_TOPIC:-omop-cdss-ai-alerts}"

[tasks."omop:consume:events"]
description = "Stream live standardized OMOP events directly from Kafka topic omop-standard-events"
run = "docker compose -f docker/docker-compose.yml exec -T kafka kafka-console-consumer --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --topic ${OMOP_EVENTS_TOPIC:-omop-standard-events}"

[tasks."omop:run-demo"]
depends = ["schema:register:omop", "kafka:reset:omop"]
description = "Run the hybrid inline datagen OMOP Vocab Mapping pipeline (auto-registers schemas, clears Kafka topic, and runs pipeline)"
run = '''
mise run ff:run hybrid/omop/omop-vocab-mapping-demo
echo "Streaming live clinical alerts (Press Ctrl+C to exit log stream)..."
mise run flink:logs
'''

[tasks."omop:run-ai-demo"]
depends = ["schema:register:omop", "kafka:reset:omop"]
description = "Run the AI CDSS Agent OMOP streaming pipeline with Google Gemini / LLM reasoning (auto-registers schemas and resets Kafka)"
run = '''
mise run ff:run hybrid/omop/omop-ai-cdss-agent
echo "Streaming live AI CDSS assessments (Press Ctrl+C to exit log stream)..."
mise run flink:logs
'''

[tasks."test:omop"]
description = "Run comprehensive unit test suite for modular OMOP AI CDSS pipeline"
run = "python -m unittest discover -s flinkflow-jobs/hybrid/omop/tests -p \"test_*.py\" -v"

# -----------------------------------------------------------------------------
# KUBERNETES & APACHE FLINK OPERATOR (Production GitOps Lifecycle)
# -----------------------------------------------------------------------------

[tasks."k8s:init"]
description = "Initialize cert-manager and Apache Flink Kubernetes Operator in WSL/Kubernetes"
run = "bash scripts/k8s_setup_wsl.sh"

[tasks."k8s:deploy:omop"]
description = "Compile modular DAG, update ConfigMap & Secrets, and submit FlinkDeployment to Flink Operator"
