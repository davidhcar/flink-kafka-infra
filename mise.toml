[tasks."k8s:status"]
description = "Check status of Flink deployments and pods in flink-production namespace"
run = "kubectl get flinkdeployment,pods,svc -n flink-production -o wide"

[tasks."k8s:logs"]
description = "Tail live logs from the Flink JobManager pod in Kubernetes"
run = "kubectl logs -n flink-production -l app.kubernetes.io/name=omop-ai-cdss-pipeline -c flink-main-container -f"

[tasks."k8s:ui"]
description = "Port-forward Flink Web Dashboard from Kubernetes to http://localhost:8081"
run = "kubectl port-forward -n flink-production svc/omop-ai-cdss-pipeline-rest 8081:8081"

