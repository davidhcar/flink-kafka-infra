# ==============================================================================
# Flinkflow Local Development Taskfile (mise.toml)
# Exclusively for Local Development & Testing (Zero K8s Dependencies)
# Note: Staging & Production deployments are handled 100% via CI/CD pipelines.
# ==============================================================================

# ==============================================================================
# 1. GLOBAL LOCAL CONFIGURATION & HEALTHCHECKS
# ==============================================================================

[env]
_.file = "env.local"

[tasks."ontology:sync"]
description = "Extract and sync Flinkflow Core Ontology Knowledge Graph from Java engine into config/ontology.json"
run = "python3 scripts/extract_ontology.py 2>/dev/null || python scripts/extract_ontology.py || py scripts/extract_ontology.py"

[tasks."env:healthcheck"]
description = "Validate local connection details and network targets from env.local"
run = "python3 scripts/env_healthcheck.py 2>/dev/null || python scripts/env_healthcheck.py || py scripts/env_healthcheck.py"

[tasks."ff:healthcheck"]
description = "Run Flinkflow Environment Healthcheck DSL Pipeline on local cluster"
run = '''#!/usr/bin/env bash
mise run ff-local:run python/env-healthcheck
sleep 3
docker compose -f docker/docker-compose.yml logs --tail=25 ff-taskmanager
'''

# ==============================================================================
# 2. LOCAL DOCKER INFRASTRUCTURE LIFECYCLE (ff-local:)
# ==============================================================================

[tasks."ff-local:start"]
description = "Start local Flinkflow Docker services (Kafka, Postgres, Schema Registry, Flink, Vocab Service)"
run = "docker compose -f docker/docker-compose.yml up -d postgres kafka schema-registry kafka-connect kafka-ui ff-jobmanager ff-taskmanager vocab-service"

[tasks."ff-local:stop"]
description = "Stop and remove all local Flinkflow Docker containers"
run = "docker compose -f docker/docker-compose.yml down --remove-orphans"

[tasks."ff-local:status"]
description = "List status of all running local Docker containers"
run = "docker compose -f docker/docker-compose.yml ps"

[tasks."ff-local:langfuse:start"]
description = "Start local Langfuse observability stack (Postgres, Clickhouse, Minio, Redis)"
run = "docker compose -f docker/docker-compose.yml up -d postgres clickhouse minio redis langfuse langfuse-worker"

[tasks."ff-local:langfuse:stop"]
description = "Stop local Langfuse observability stack"
run = "docker compose -f docker/docker-compose.yml stop clickhouse minio redis langfuse langfuse-worker && docker compose -f docker/docker-compose.yml rm -f clickhouse minio redis langfuse langfuse-worker"

# ------------------------------------------------------------------------------
# 2.1 Local Web Interface Launchers (Browser Openers)
# ------------------------------------------------------------------------------

[tasks."open:kafka-ui"]
description = "Open local Kafka UI web interface (port 8080)"
run = "cmd.exe /c start \"\" \"http://localhost:8080\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:8080'\" 2>/dev/null || wslview \"http://localhost:8080\" 2>/dev/null || xdg-open \"http://localhost:8080\" 2>/dev/null || open \"http://localhost:8080\""

[tasks."open:flink-ui"]
description = "Open local Flink Dashboard web interface (port 8081)"
run = "cmd.exe /c start \"\" \"http://localhost:8081\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:8081'\" 2>/dev/null || wslview \"http://localhost:8081\" 2>/dev/null || xdg-open \"http://localhost:8081\" 2>/dev/null || open \"http://localhost:8081\""

[tasks."open:vocab-service"]
description = "Open local OMOP Vocabulary Service health check (port 8082)"
run = "cmd.exe /c start \"\" \"http://localhost:8082/health\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:8082/health'\" 2>/dev/null || wslview \"http://localhost:8082/health\" 2>/dev/null || xdg-open \"http://localhost:8082/health\" 2>/dev/null || open \"http://localhost:8082/health\""

[tasks."open:schema-registry"]
description = "Open local Schema Registry web interface (port 8084)"
run = "cmd.exe /c start \"\" \"http://localhost:8084/subjects\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:8084/subjects'\" 2>/dev/null || wslview \"http://localhost:8084/subjects\" 2>/dev/null || xdg-open \"http://localhost:8084/subjects\" 2>/dev/null || open \"http://localhost:8084/subjects\""

[tasks."open:langfuse"]
description = "Open local Langfuse Web UI (port 4000)"
run = "cmd.exe /c start \"\" \"http://localhost:4000\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:4000'\" 2>/dev/null || wslview \"http://localhost:4000\" 2>/dev/null || xdg-open \"http://localhost:4000\" 2>/dev/null || open \"http://localhost:4000\""

[tasks."open:minio"]
description = "Open local MinIO Console (port 9001)"
run = "cmd.exe /c start \"\" \"http://localhost:9001\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:9001'\" 2>/dev/null || wslview \"http://localhost:9001\" 2>/dev/null || xdg-open \"http://localhost:9001\" 2>/dev/null || open \"http://localhost:9001\""

# ------------------------------------------------------------------------------
# 2.2 Local Pipeline Execution (Docker Cluster)
# ------------------------------------------------------------------------------

[tasks."ff-local:cancel"]
description = "Cancel all running Flink jobs on local Docker cluster"
run = '''
docker compose -f docker/docker-compose.yml exec -T ff-jobmanager sh -c '
  jobs=$(flink list -r 2>/dev/null | grep -Eo "[0-9a-f]{32}")
  if [ -n "$jobs" ]; then
    echo "$jobs" | xargs -r -n 1 flink cancel 2>/dev/null || true
  fi
'
docker compose -f docker/docker-compose.yml restart -t 1 ff-taskmanager
'''

[tasks."ff-local:run"]
depends = ["ff-local:cancel"]
description = "Submit any YAML pipeline to local Docker JobManager (e.g. mise run ff-local:run sql/interval-join)"
usage = 'arg "<pipeline>" help="Pipeline path relative to flinkflow-jobs (e.g. sql/interval-join, hybrid/omop/omop-ai-cdss-agent)"'
run = '''#!/usr/bin/env bash
file="${usage_pipeline?}"
[[ "$file" != *.yaml && "$file" != *.yml ]] && file="${file}.yaml"
file="${file#flinkflow-jobs/}"

python3 scripts/render_pipeline.py "flinkflow-jobs/${file}" "flinkflow-jobs/.rendered/${file}" 2>/dev/null || python scripts/render_pipeline.py "flinkflow-jobs/${file}" "flinkflow-jobs/.rendered/${file}" || py scripts/render_pipeline.py "flinkflow-jobs/${file}" "flinkflow-jobs/.rendered/${file}" || cp "flinkflow-jobs/${file}" "flinkflow-jobs/.rendered/${file}"

docker compose -f docker/docker-compose.yml exec -T ff-jobmanager \
	flink run -d -c ai.talweg.flinkflow.FlinkflowApp \
	/opt/flink/usrlib/flinkflow.jar \
	"/opt/flink/flinkflow-jobs/.rendered/${file}"
'''

[tasks."ff-local:logs"]
description = "Follow live logs from local Flink TaskManager container"
run = "docker compose -f docker/docker-compose.yml logs -f --tail=50 ff-taskmanager"

[tasks."ff-local:list"]
description = "List all local FlinkFlow YAML pipelines and select one to run interactively"
run = '''#!/usr/bin/env bash
pipelines=$(find flinkflow-jobs -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
[ -z "$pipelines" ] && { echo "No pipelines found in flinkflow-jobs" >&2; exit 1; }

if command -v fzf >/dev/null 2>&1; then
	pipeline=$(echo "$pipelines" | fzf --prompt="Select pipeline (↑/↓ to navigate, Enter to run): " --height=40% --layout=reverse --border)
	[ -z "$pipeline" ] && exit 0
else
	echo "Select a pipeline (type number + Enter):"
	select pipeline in $pipelines; do
		[ -n "$pipeline" ] && break
		echo "Invalid selection"
	done
fi

[ -z "$pipeline" ] && exit 0
mise run ff-local:run "$pipeline"
'''

# ------------------------------------------------------------------------------
# 2.3 Local Language-Specific Shortcuts
# ------------------------------------------------------------------------------

[tasks."ff-java:run"]
description = "Submit Java pipeline to local JobManager (e.g. uppercase)"
usage = 'arg "<pipeline>" help="Pipeline YAML name"'
run = 'mise run ff-local:run "java/$usage_pipeline"'

[tasks."ff-py:run"]
description = "Submit Python pipeline to local JobManager (e.g. datetime)"
usage = 'arg "<pipeline>" help="Pipeline YAML name"'
run = 'mise run ff-local:run "python/$usage_pipeline"'

[tasks."ff-sql:run"]
description = "Submit SQL pipeline to local JobManager (e.g. interval-join)"
usage = 'arg "<pipeline>" help="Pipeline YAML name"'
run = 'mise run ff-local:run "sql/$usage_pipeline"'

[tasks."ff-hybrid:run"]
description = "Submit Hybrid pipeline to local JobManager (e.g. omop/omop-ai-cdss-agent)"
usage = 'arg "<pipeline>" help="Pipeline YAML name"'
run = 'mise run ff-local:run "hybrid/$usage_pipeline"'

# ------------------------------------------------------------------------------
# 2.4 Local Ephemeral Standalone MiniCluster (Zero Cluster Running)
# ------------------------------------------------------------------------------

[tasks."ff-local:minicluster"]
description = "Run any YAML pipeline in an ephemeral standalone container (MiniCluster)"
usage = 'arg "<pipeline>" help="Pipeline path relative to flinkflow-jobs (e.g. java/uppercase, python/datetime)"'
run = '''#!/usr/bin/env bash
pipeline="${usage_pipeline?}"
[[ "$pipeline" != *.yaml && "$pipeline" != *.yml ]] && pipeline="${pipeline}.yaml"
pipeline="${pipeline#flinkflow-jobs/}"

python3 scripts/render_pipeline.py "flinkflow-jobs/${pipeline}" "flinkflow-jobs/.rendered/${pipeline}" 2>/dev/null || python scripts/render_pipeline.py "flinkflow-jobs/${pipeline}" "flinkflow-jobs/.rendered/${pipeline}" || py scripts/render_pipeline.py "flinkflow-jobs/${pipeline}" "flinkflow-jobs/.rendered/${pipeline}" || cp "flinkflow-jobs/${pipeline}" "flinkflow-jobs/.rendered/${pipeline}"

env_flag=""
[ -f "env.local" ] && env_flag="--env-file env.local"
docker run --rm --network host $env_flag -v "$(pwd)/flinkflow-jobs/.rendered/${pipeline}:/app/pipeline.yaml" \
	ghcr.io/talwegai/flinkflow:latest \
	java \
	-cp "/opt/flink/usrlib/flinkflow.jar:/opt/flink/lib/*" \
	ai.talweg.flinkflow.FlinkflowApp /app/pipeline.yaml 2>&1 | grep -v "SLF4J:" | {
	spin='⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'
	i=0
	first_line=1
	while true; do
		if read -t 0.1 -r line; then
			if [ $first_line -eq 1 ]; then
				printf "\033[2K\r"
				first_line=0
			fi
			echo "$line"
		else
			ret=$?
			if [ $ret -gt 128 ]; then
				if [ $first_line -eq 1 ]; then
					i=$(( (i+1) % 10 ))
					printf "\033[2K\r${spin:$i:1} Loading Flinkflow..."
				fi
			else
				break
			fi
		fi
	done
}
'''

# ------------------------------------------------------------------------------
# 2.5 Local Testing & Database Utilities
# ------------------------------------------------------------------------------

[tasks."schema:register:all"]
description = "Register all schemas in schemas/ directory with local Schema Registry"
run = "python3 scripts/register_schemas.py 2>/dev/null || python scripts/register_schemas.py || py scripts/register_schemas.py"

[tasks."schema:register"]
description = "Register a specific schema file with local Schema Registry"
usage = 'arg "<target>" help="Schema file path or pattern in schemas/"'
run = 'python3 scripts/register_schemas.py "$usage_target" 2>/dev/null || python scripts/register_schemas.py "$usage_target" || py scripts/register_schemas.py "$usage_target"'

[tasks."schema:list"]
description = "List all registered subjects from local Schema Registry"
run = "curl -s ${SCHEMA_REGISTRY_URL_LOCAL:-http://localhost:8084}/subjects | jq . 2>/dev/null || curl -s ${SCHEMA_REGISTRY_URL_LOCAL:-http://localhost:8084}/subjects"

[tasks."kafka:reset:omop"]
description = "Purge and recreate local Kafka OMOP topics"
run = '''
docker compose -f docker/docker-compose.yml exec -T kafka sh -c '
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --delete --topic ${OMOP_EVENTS_TOPIC:-omop-standard-events} 2>/dev/null || true
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --delete --topic ${OMOP_ALERTS_TOPIC:-omop-clinical-alerts} 2>/dev/null || true
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --delete --topic ${OMOP_AI_ALERTS_TOPIC:-omop-cdss-ai-alerts} 2>/dev/null || true
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --create --topic ${OMOP_EVENTS_TOPIC:-omop-standard-events} --partitions 1 --replication-factor 1 2>/dev/null || true
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --create --topic ${OMOP_ALERTS_TOPIC:-omop-clinical-alerts} --partitions 1 --replication-factor 1 2>/dev/null || true
  kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --create --topic ${OMOP_AI_ALERTS_TOPIC:-omop-cdss-ai-alerts} --partitions 1 --replication-factor 1 2>/dev/null || true
'
'''

[tasks."omop:consume:ai-alerts"]
description = "Stream live AI CDSS diagnostic alerts from local Kafka"
run = "docker compose -f docker/docker-compose.yml exec -T kafka kafka-console-consumer --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS_LOCAL:-localhost:9092} --topic ${OMOP_AI_ALERTS_TOPIC:-omop-cdss-ai-alerts}"

[tasks."test:omop"]
description = "Run local Python unit test suite for OMOP pipeline"
run = "python -m unittest discover -s flinkflow-jobs/hybrid/omop/tests -p \"test_*.py\" -v"

[tasks."postgres:connect"]
description = "Connect to local PostgreSQL database (outbox_demo) using interactive psql client"
run = "docker exec -it $(docker compose -f docker/docker-compose.yml ps -q postgres) psql -U postgres -d outbox_demo"
