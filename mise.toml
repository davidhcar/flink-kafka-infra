# Project dependencies: java, maven, flink, lein

# -----------------------------------------------------------------------------
# GLOBAL ENVIRONMENT CONFIGURATION
# -----------------------------------------------------------------------------

[env]
_.file = "env.local"

# -----------------------------------------------------------------------------
# CORE & HEALTHCHECK TASKS
# -----------------------------------------------------------------------------

[tasks."env:healthcheck"]
description = "Validate all connection details and network targets from env.local"
run = "python3 scripts/env_healthcheck.py 2>/dev/null || python scripts/env_healthcheck.py || py scripts/env_healthcheck.py"

[tasks."ff:healthcheck"]
description = "Run Flinkflow Environment Healthcheck DSL Pipeline on cluster and display output"
run = '''#!/usr/bin/env bash
mise run ff:run python/env-healthcheck
sleep 3
docker compose -f docker/docker-compose.yml logs --tail=25 ff-taskmanager
'''

# -----------------------------------------------------------------------------
# DOCKER INFRASTRUCTURE TASKS
# -----------------------------------------------------------------------------

[tasks."docker:start:langfuse"]
description = "Start Langfuse and its dependencies (Postgres, Clickhouse, Minio, Redis)"
run = "docker compose -f docker/docker-compose.yml up -d postgres clickhouse minio redis langfuse langfuse-worker"

[tasks."docker:stop:langfuse"]
description = "Stop and remove Langfuse and its private dependencies"
run = "docker compose -f docker/docker-compose.yml stop clickhouse minio redis langfuse langfuse-worker && docker compose -f docker/docker-compose.yml rm -f clickhouse minio redis langfuse langfuse-worker"

[tasks."docker:start:flinkflow"]
description = "Start Flinkflow and its dependencies (Postgres, Kafka, Schema Registry, Connect, Flink, Vocab Service)"
run = "docker compose -f docker/docker-compose.yml up -d postgres kafka schema-registry kafka-connect kafka-ui ff-jobmanager ff-taskmanager vocab-service"

[tasks."docker:stop:flinkflow"]
description = "Stop and remove Flinkflow and its private dependencies"
run = "docker compose -f docker/docker-compose.yml stop kafka schema-registry kafka-connect kafka-ui ff-jobmanager ff-taskmanager vocab-service && docker compose -f docker/docker-compose.yml rm -f kafka schema-registry kafka-connect kafka-ui ff-jobmanager ff-taskmanager vocab-service"

[tasks."docker:stop:all"]
description = "Stop and remove all running Docker containers including Postgres"
run = "docker compose -f docker/docker-compose.yml down --remove-orphans"

[tasks."docker:ps"]
description = "List status of all running Docker containers"
run = "docker compose -f docker/docker-compose.yml ps"

# -----------------------------------------------------------------------------
# WEB INTERFACE UTILITIES (Cross-Platform Browser Launcher: WSL, Linux, macOS, Windows)
# -----------------------------------------------------------------------------

[tasks."open:kafka-ui"]
description = "Open Kafka UI web interface in browser (port 8080)"
run = "cmd.exe /c start \"\" \"http://localhost:8080\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:8080'\" 2>/dev/null || wslview \"http://localhost:8080\" 2>/dev/null || xdg-open \"http://localhost:8080\" 2>/dev/null || open \"http://localhost:8080\""

[tasks."open:flink-ui"]
description = "Open Flink Dashboard web interface in browser (port 8081)"
run = "cmd.exe /c start \"\" \"http://localhost:8081\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:8081'\" 2>/dev/null || wslview \"http://localhost:8081\" 2>/dev/null || xdg-open \"http://localhost:8081\" 2>/dev/null || open \"http://localhost:8081\""

[tasks."open:vocab-service"]
description = "Open OMOP Vocabulary Service health check in browser (port 8082)"
run = "cmd.exe /c start \"\" \"http://localhost:8082/health\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:8082/health'\" 2>/dev/null || wslview \"http://localhost:8082/health\" 2>/dev/null || xdg-open \"http://localhost:8082/health\" 2>/dev/null || open \"http://localhost:8082/health\""

[tasks."open:schema-registry"]
description = "Open Schema Registry web interface in browser (port 8084)"
run = "cmd.exe /c start \"\" \"http://localhost:8084/subjects\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:8084/subjects'\" 2>/dev/null || wslview \"http://localhost:8084/subjects\" 2>/dev/null || xdg-open \"http://localhost:8084/subjects\" 2>/dev/null || open \"http://localhost:8084/subjects\""

[tasks."open:langfuse"]
description = "Open Langfuse Web UI in browser (port 4000)"
run = "cmd.exe /c start \"\" \"http://localhost:4000\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:4000'\" 2>/dev/null || wslview \"http://localhost:4000\" 2>/dev/null || xdg-open \"http://localhost:4000\" 2>/dev/null || open \"http://localhost:4000\""

[tasks."open:minio"]
description = "Open MinIO Console in browser (port 9001)"
run = "cmd.exe /c start \"\" \"http://localhost:9001\" 2>/dev/null || powershell.exe -NoProfile -Command \"Start-Process 'http://localhost:9001'\" 2>/dev/null || wslview \"http://localhost:9001\" 2>/dev/null || xdg-open \"http://localhost:9001\" 2>/dev/null || open \"http://localhost:9001\""

# -----------------------------------------------------------------------------
# FLINK NATIVE JOBS TASKS
# -----------------------------------------------------------------------------

[tasks."flink:logs"]
description = "Display FlinkFlow TaskManager logs in follow mode"
run = "docker compose -f docker/docker-compose.yml logs -f --tail=50 ff-taskmanager"

[tasks."flink:build"]
description = "Build Flink Jobs JAR package using Maven"
run = "cd flink-jobs && mvn clean package"

[tasks."flink:run:word-count"]
depends = ["flink:build"]
description = "Run Word Count job that processes static text data and counts word occurrences"
run = "flink run -c flinkfintechpoc.jobs.WordCountJob flink-jobs/target/flink-jobs-1.0-SNAPSHOT.jar"

[tasks."flink:jobs:cancel"]
description = "Cancel all running Flink jobs and fast-reset TaskManager"
run = '''
docker compose -f docker/docker-compose.yml exec -T ff-jobmanager sh -c '
  jobs=$(flink list -r 2>/dev/null | grep -Eo "[0-9a-f]{32}")
  if [ -n "$jobs" ]; then
    echo "$jobs" | xargs -r -n 1 flink cancel 2>/dev/null || true
  fi
'
docker compose -f docker/docker-compose.yml restart -t 1 ff-taskmanager
'''

# -----------------------------------------------------------------------------
# FLINKFLOW UNIFIED CLUSTER RUNNER (Single Source of Truth)
# -----------------------------------------------------------------------------

[tasks."ff:run"]
depends = ["flink:jobs:cancel"]
description = "Submit any YAML pipeline to JobManager cluster by path (e.g. java/uppercase, python/datetime, hybrid/omop/...)"
usage = 'arg "<pipeline>" help="Pipeline path relative to flinkflow-jobs"'
run = '''#!/usr/bin/env bash
file="${usage_pipeline?}"
[[ "$file" != *.yaml && "$file" != *.yml ]] && file="${file}.yaml"
file="${file#flinkflow-jobs/}"

python3 scripts/render_pipeline.py "flinkflow-jobs/${file}" "flinkflow-jobs/.rendered/${file}" 2>/dev/null || python scripts/render_pipeline.py "flinkflow-jobs/${file}" "flinkflow-jobs/.rendered/${file}" || py scripts/render_pipeline.py "flinkflow-jobs/${file}" "flinkflow-jobs/.rendered/${file}" || cp "flinkflow-jobs/${file}" "flinkflow-jobs/.rendered/${file}"

docker compose -f docker/docker-compose.yml exec -T ff-jobmanager \
	flink run -d -c ai.talweg.flinkflow.FlinkflowApp \
	/opt/flink/usrlib/flinkflow.jar \
	"/opt/flink/flinkflow-jobs/.rendered/${file}"
'''

[tasks."ff:list"]
description = "List FlinkFlow YAML pipelines and select one to run"
run = '''#!/usr/bin/env bash
pipelines=$(find flinkflow-jobs -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
[ -z "$pipelines" ] && { echo "No pipelines found in flinkflow-jobs" >&2; exit 1; }

if command -v fzf >/dev/null 2>&1; then
	pipeline=$(echo "$pipelines" | fzf --prompt="Select pipeline (↑/↓ to navigate, Enter to run): " --height=40% --layout=reverse --border)
	[ -z "$pipeline" ] && exit 0
else
	echo "Select a pipeline (type number + Enter):"
	select pipeline in $pipelines; do
		[ -n "$pipeline" ] && break
		echo "Invalid selection"
	done
fi

[ -z "$pipeline" ] && exit 0
mise run ff:run "$pipeline"
'''

# -----------------------------------------------------------------------------
# RUNNER SHORTCUTS (Delegates to ff:run)
# -----------------------------------------------------------------------------

[tasks."ff-java:cluster"]
description = "Submit Java YAML pipeline to JobManager cluster"
usage = 'arg "<pipeline>" help="Pipeline YAML file (e.g. uppercase)"'
run = 'mise run ff:run "java/$usage_pipeline"'

[tasks."ff-java:run"]
description = "Submit Java YAML pipeline to JobManager (alias for ff-java:cluster)"
usage = 'arg "<pipeline>" help="Pipeline YAML file (e.g. uppercase)"'
run = 'mise run ff:run "java/$usage_pipeline"'

[tasks."ff-py:cluster"]
description = "Submit Python YAML pipeline to JobManager cluster"
usage = 'arg "<pipeline>" help="Pipeline YAML file (e.g. datetime)"'
run = 'mise run ff:run "python/$usage_pipeline"'

[tasks."ff-py:run"]
description = "Submit Python YAML pipeline to JobManager (alias for ff-py:cluster)"
usage = 'arg "<pipeline>" help="Pipeline YAML file (e.g. datetime)"'
run = 'mise run ff:run "python/$usage_pipeline"'

[tasks."ff-sql:cluster"]
description = "Submit SQL YAML pipeline to JobManager cluster"
usage = 'arg "<pipeline>" help="Pipeline YAML file (e.g. interval-join)"'
run = 'mise run ff:run "sql/$usage_pipeline"'

[tasks."ff-sql:run"]
description = "Submit SQL YAML pipeline to JobManager (alias for ff-sql:cluster)"
usage = 'arg "<pipeline>" help="Pipeline YAML file (e.g. interval-join)"'
run = 'mise run ff:run "sql/$usage_pipeline"'

[tasks."ff-hybrid:cluster"]
