# Project dependencies: java, maven, flink, lein

[tasks."docker:start:all"]
description = "Start all required Docker containers (Kafka, Flink, Postgres, Schema Registry, Kafka UI)"
run = "docker compose -f docker/docker-compose.yml up -d"

[tasks."docker:stop:all"]
description = "Stop all running Docker containers"
run = "docker compose -f docker/docker-compose.yml down --remove-orphans"

[tasks."docker:restart:all"]
description = "Restart all Docker containers"
run = "docker compose -f docker/docker-compose.yml restart"

[tasks."docker:rebuild:all"]
description = "Rebuild and start all required Docker containers"
run = "docker compose -f docker/docker-compose.yml up -d --build"

[tasks."docker:ps"]
run = "docker compose -f docker/docker-compose.yml ps"

[tasks."flink:logs"]
description = "Display Flink TaskManager logs in follow mode"
run = "docker compose -f docker/docker-compose.yml logs taskmanager --follow"

[tasks."open:kafka-ui"]
description = "Open Kafka UI web interface in browser (port 8080)"
run = "open http://localhost:8080"

[tasks."open:flink-ui"]
description = "Open Flink Dashboard web interface in browser (port 8081)"
run = "open http://localhost:8081"

[tasks."open:schema-registry"]
description = "Open Schema Registry web interface in browser (port 8084)"
run = "open http://localhost:8084/subjects"

[tasks."flink:build"]
description = "Build Flink Jobs JAR package using Maven"
run = "cd flink-jobs && mvn clean package"

[tasks."flink:run:customer-analytics"]
depends = ["flink:build"]
description = "Run Customer Analytics job that counts customers created per minute"
run = "flink run -c flinkfintechpoc.jobs.CustomerAnalyticsJob flink-jobs/target/flink-jobs-1.0-SNAPSHOT.jar"

[tasks."flink:run:word-count"]
depends = ["flink:build"]
description = "Run Word Count job that processes static text data and counts word occurrences"
run = "flink run -c flinkfintechpoc.jobs.WordCountJob flink-jobs/target/flink-jobs-1.0-SNAPSHOT.jar"

[tasks."flink:run:customer-debezium"]
depends = ["flink:jobs:cancel", "flink:build"]
description = "Run Customer Debezium job that processes CDC events from PostgreSQL via Kafka"
run = "flink run -c flinkfintechpoc.jobs.CustomerDebeziumJob flink-jobs/target/flink-jobs-1.0-SNAPSHOT.jar"

[tasks."ff:list"]
description = "List FlinkFlow YAML pipelines and select one to run"
run = '''#!/usr/bin/env bash
if [ ! -d "flinkflow-jobs" ]; then
	echo "Directory not found: flinkflow-jobs" >&2
	exit 1
fi

pipelines=$(find flinkflow-jobs -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
if [ -z "$pipelines" ]; then
	echo "No YAML pipelines found in flinkflow-jobs" >&2
	exit 1
fi

echo "Select a pipeline to run:"
IFS=$'\n'
select pipeline in $pipelines; do
	if [ -n "$pipeline" ]; then
		name="${pipeline#flinkflow-jobs/}"
		name="${name%.yaml}"
		name="${name%.yml}"
		case "$name" in
			java/*)
				echo "Running: mise run ff-java:run ${name#java/}"
				mise run ff-java:run "${name#java/}"
				break
				;;
			python/*)
				echo "Running: mise run ff-py:run ${name#python/}"
				mise run ff-py:run "${name#python/}"
				break
				;;
			sql/*)
				echo "Running: mise run ff-sql:run ${name#sql/}"
				mise run ff-sql:run "${name#sql/}"
				break
				;;
			*)
				echo "No runner configured for $pipeline"
				break
				;;
		esac
	else
		echo "Invalid selection."
	fi
done
'''

[tasks."ff-java:run"]
description = "Run a FlinkFlow YAML pipeline in Docker"
dir = "flinkflow-jobs/java"
usage = 'arg "<pipeline>" help="Pipeline YAML file"'
run = '''#!/usr/bin/env bash
pipeline="${usage_pipeline?}.yaml"
docker run --rm --network host -v "$(pwd)/${pipeline}:/app/pipeline.yaml" \
	ghcr.io/talwegai/flinkflow:0.9.6 \
	java \
	-cp "/opt/flink/usrlib/flinkflow.jar:/opt/flink/lib/*" \
	ai.talweg.flinkflow.FlinkflowApp /app/pipeline.yaml 2>&1 | grep -v "SLF4J:" | {
	spin='⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'
	i=0
	first_line=1
	while true; do
		if read -t 0.1 -r line; then
			if [ $first_line -eq 1 ]; then
				printf "\033[2K\r"
				first_line=0
			fi
			echo "$line"
		else
			ret=$?
			if [ $ret -gt 128 ]; then
				if [ $first_line -eq 1 ]; then
					i=$(( (i+1) % 10 ))
					printf "\033[2K\r${spin:$i:1} Loading Flinkflow..."
				fi
			else
				break
			fi
		fi
	done
}
'''

