
name: "Kafka Transform Pipeline"
parallelism: 1

steps:
  - type: source
    name: kafka-source
    properties:
      bootstrap.servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}"
      topic: "${KAFKA_SOURCE_TOPIC:-source-topic}"
      group.id: "${KAFKA_GROUP_ID:-flinkflow-group}"
      
  - type: process
    name: transformation
    language: "python"
    code: |
      processed = input.upper()
      return f"Processed: {processed}"

  - type: sink
    name: kafka-sink
    properties:
      bootstrap.servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}"
      topic: "${KAFKA_SINK_TOPIC:-sink-topic}"
