name: "Flinkflow Environment & Connection Healthcheck"
parallelism: 1

# ==============================================================================
# Flinkflow DSL Pipeline: Environment Healthcheck
# Validates all connection environment variables declared in env.local
# (Kafka, Schema Registry, Kafka Connect, Postgres, Vocab Service, Clickhouse, Minio)
#
# Run via:
#   mise run ff:run python/env-healthcheck
#   mise run ff-py:local env-healthcheck
# ==============================================================================

steps:
  - type: source
    name: trigger-source
    connector: static-source
    properties:
      content: '{"check": "all_connections"}'

  - type: process
    name: connection-healthcheck
    language: python
    code: |
      import os, socket, time, json
      try:
          import urllib.request
          import urllib.error
      except ImportError:
          pass

      def check_tcp(host, port, timeout=2.0):
          try:
              start = time.time()
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(timeout)
              res = sock.connect_ex((host, int(port)))
              sock.close()
              elapsed = (time.time() - start) * 1000
              if res == 0:
                  return True, f"{elapsed:.1f}ms", "CONNECTED"
              else:
                  return False, "-", f"ERR_CODE_{res}"
          except Exception as e:
              return False, "-", str(e)

      def check_http(url, timeout=2.0):
          try:
              start = time.time()
              req = urllib.request.Request(url, headers={"User-Agent": "Flinkflow-Healthcheck"})
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  code = resp.getcode()
                  elapsed = (time.time() - start) * 1000
                  return (code < 400), f"{elapsed:.1f}ms", f"HTTP_{code}"
          except urllib.error.HTTPError as e:
              elapsed = (time.time() - start) * 1000
              return True, f"{elapsed:.1f}ms", f"HTTP_{e.code}"
          except Exception as e:
              return False, "-", str(e)

      def check_flink(url, timeout=2.0):
          try:
              start = time.time()
              req = urllib.request.Request(url, headers={"User-Agent": "Flinkflow-Healthcheck"})
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  elapsed = (time.time() - start) * 1000
                  tm_count = data.get("taskmanagers", 0)
                  slots_total = data.get("slots-total", 0)
                  slots_avail = data.get("slots-available", 0)
                  jobs_running = data.get("jobs-running", 0)
                  if tm_count > 0 and slots_total > 0:
                      details = f"Slots: {slots_avail}/{slots_total} avail ({tm_count} TM, {jobs_running} running)"
                      return True, f"{elapsed:.1f}ms", details
                  else:
                      details = f"WARN: 0 TaskManagers (0/{slots_total} slots)"
                      return False, f"{elapsed:.1f}ms", details
          except Exception as e:
              return False, "-", str(e)

      # 1. Discover all connection environment variables
      env_vars = {
          "KAFKA_BOOTSTRAP_SERVERS": os.environ.get("KAFKA_BOOTSTRAP_SERVERS", "kafka:29092"),
          "KAFKA_BOOTSTRAP_SERVERS_LOCAL": os.environ.get("KAFKA_BOOTSTRAP_SERVERS_LOCAL", "localhost:9092"),
          "SCHEMA_REGISTRY_URL": os.environ.get("SCHEMA_REGISTRY_URL", "http://schema-registry:8081"),
          "SCHEMA_REGISTRY_URL_LOCAL": os.environ.get("SCHEMA_REGISTRY_URL_LOCAL", "http://localhost:8084"),
          "KAFKA_CONNECT_URL": os.environ.get("KAFKA_CONNECT_URL", "http://kafka-connect:8083"),
          "KAFKA_CONNECT_URL_LOCAL": os.environ.get("KAFKA_CONNECT_URL_LOCAL", "http://localhost:8083"),
          "FLINK_JOBMANAGER_URL": os.environ.get("FLINK_JOBMANAGER_URL", "http://ff-jobmanager:8081"),
          "POSTGRES_HOST": os.environ.get("POSTGRES_HOST", "postgres"),
          "POSTGRES_PORT": os.environ.get("POSTGRES_PORT", "5432"),
          "POSTGRES_USER": os.environ.get("POSTGRES_USER", "postgres"),
          "POSTGRES_DB": os.environ.get("POSTGRES_DB", "outbox_demo"),
          "POSTGRES_URL": os.environ.get("POSTGRES_URL", "jdbc:postgresql://postgres:5432/outbox_demo"),
          "POSTGRES_URL_LOCAL": os.environ.get("POSTGRES_URL_LOCAL", "jdbc:postgresql://localhost:5432/outbox_demo"),
          "VOCAB_SERVICE_URL": os.environ.get("VOCAB_SERVICE_URL", "http://vocab-service:8082"),
          "VOCAB_SERVICE_URL_LOCAL": os.environ.get("VOCAB_SERVICE_URL_LOCAL", "http://localhost:8082"),
          "CLICKHOUSE_HOST": os.environ.get("CLICKHOUSE_HOST", "clickhouse"),
          "CLICKHOUSE_PORT": os.environ.get("CLICKHOUSE_PORT", "8123"),
          "MINIO_ENDPOINT": os.environ.get("MINIO_ENDPOINT", "http://minio:9000"),
          "REDIS_HOST": os.environ.get("REDIS_HOST", "redis"),
          "REDIS_PORT": os.environ.get("REDIS_PORT", "6379"),
          "LANGFUSE_URL": os.environ.get("LANGFUSE_URL", "http://langfuse:3000")
      }

      # 2. Run connectivity tests
      targets = [
          ("Apache Kafka (Container)", env_vars["KAFKA_BOOTSTRAP_SERVERS"], "tcp"),
          ("Schema Registry", env_vars["SCHEMA_REGISTRY_URL"] + "/subjects", "http"),
          ("Kafka Connect", env_vars["KAFKA_CONNECT_URL"] + "/connectors", "http"),
          ("Flink JobManager & Slots", env_vars["FLINK_JOBMANAGER_URL"] + "/overview", "flink"),
          ("PostgreSQL Database", f"{env_vars['POSTGRES_HOST']}:{env_vars['POSTGRES_PORT']}", "tcp"),
          ("OMOP Vocab Service", env_vars["VOCAB_SERVICE_URL"] + "/health", "http"),
          ("ClickHouse HTTP", f"{env_vars['CLICKHOUSE_HOST']}:{env_vars['CLICKHOUSE_PORT']}", "tcp"),
          ("MinIO Health", env_vars["MINIO_ENDPOINT"] + "/minio/health/live", "http"),
          ("Redis Cache", f"{env_vars['REDIS_HOST']}:{env_vars['REDIS_PORT']}", "tcp"),
          ("Langfuse Web App", f"{env_vars['LANGFUSE_URL']}/api/public/health", "http")
      ]

      results = []
      for name, endpoint, check_type in targets:
          if check_type == "tcp":
              parts = endpoint.split(":")
              host, port = parts[0], parts[1] if len(parts) > 1 else 80
              ok, latency, msg = check_tcp(host, port)
          elif check_type == "flink":
              ok, latency, msg = check_flink(endpoint)
          else:
              ok, latency, msg = check_http(endpoint)
          results.append({
              "service": name,
              "endpoint": endpoint,
              "status": "PASS" if ok else "FAIL",
              "latency": latency,
              "details": msg
          })

      # 3. Format terminal report
      bold = "\033[1m"
      cyan = "\033[1;36m"
      green = "\033[1;32m"
      red = "\033[1;31m"
      reset = "\033[0m"

      lines = [
          "",
          f"{cyan}{bold}=========================================================================================={reset}",
          f"{cyan}{bold}                FLINKFLOW CLUSTER ENVIRONMENT HEALTH CHECK REPORT                         {reset}",
          f"{cyan}{bold}=========================================================================================={reset}",
          f"{bold}{'Service':<26} {'Endpoint':<32} {'Status':<10} {'Latency':<10} {'Details'}{reset}",
          "-" * 102
      ]

      pass_count = 0
      for r in results:
          badge = f"{green}✔ PASS{reset}" if r["status"] == "PASS" else f"{red}✘ FAIL{reset}"
          if r["status"] == "PASS":
              pass_count += 1
          ep = r["endpoint"]
          if len(ep) > 30:
              ep = ep[:27] + "..."
          lines.append(f"{r['service']:<26} {ep:<32} {badge:<18} {r['latency']:<10} {r['details']}")

      lines.append("-" * 102)
      summary_color = green if pass_count == len(results) else (red if pass_count == 0 else "\033[1;33m")
      lines.append(f"{bold}Summary:{reset} {summary_color}{pass_count}/{len(results)} targets reachable from cluster{reset}")
      lines.append(f"{cyan}{bold}=========================================================================================={reset}\n")

      report_str = "\n".join(lines)
      return report_str

  - type: sink
    name: console-sink
