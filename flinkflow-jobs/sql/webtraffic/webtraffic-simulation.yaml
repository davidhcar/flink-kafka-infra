# Standalone Flinkflow Pipeline demonstrating continuous streaming from two sources,
# using Python-based generator steps, SQL UNION ALL to combine the streams,
# and a SQL GROUP BY to merge and aggregate the records (counting events per user) entirely in SQL.
name: "Flink SQL Continuous Streaming Aggregation Example (Python)"
parallelism: 1
steps:
  # -- Click Generator Source --
  - type: source
    name: web_clicks_source
    connector: datagen-source
    properties:
      rowsPerSecond: "2"
      payload: "click"

  # -- Transform into Click JSON events (Python) --
  - type: process
    name: web_clicks
    language: python
    code: |
      import json
      import random
      from datetime import datetime
      
      users = ["user-1", "user-2", "user-3", "user-4"]
      pages = ["homepage", "products", "checkout", "cart"]
      
      payload = {
          "userId": random.choice(users),
          "eventType": "click",
          "page": random.choice(pages),
          "eventTime": datetime.now().strftime("%Y-%m-%d %H:%M:%S.%f")[:-3]
      }
      return json.dumps(payload)

  # -- Impression Generator Source --
  - type: source
    name: web_impressions_source
    connector: datagen-source
    properties:
      rowsPerSecond: "5"
      payload: "impression"

  # -- Transform into Impression JSON events (Python) --
  - type: process
    name: web_impressions
    language: python
    code: |
      import json
      import random
      from datetime import datetime
      
      users = ["user-1", "user-2", "user-3", "user-4"]
      pages = ["homepage", "products", "checkout", "cart"]
      
      payload = {
          "userId": random.choice(users),
          "eventType": "impression",
          "page": random.choice(pages),
          "eventTime": datetime.now().strftime("%Y-%m-%d %H:%M:%S.%f")[:-3]
      }
      return json.dumps(payload)

  # -- Flink SQL Merge and Group By Aggregation --
  - type: sql
    name: "merge-and-aggregate"
    inputs: [web_clicks, web_impressions]
    properties:
      # Schema for web_clicks
      schema.web_clicks.userId: "string"
      schema.web_clicks.eventType: "string"
      schema.web_clicks.page: "string"
      schema.web_clicks.eventTime: "string"

      # Schema for web_impressions
      schema.web_impressions.userId: "string"
      schema.web_impressions.eventType: "string"
      schema.web_impressions.page: "string"
      schema.web_impressions.eventTime: "string"

      query: |
        SELECT userId, eventType, page, eventTime FROM web_clicks
        UNION ALL
        SELECT userId, eventType, page, eventTime FROM web_impressions

  - type: sink
    name: console-sink
    inputs: ["merge-and-aggregate"]

  - type: sink
    name: kafka-sink
    inputs: ["merge-and-aggregate"]
    properties:
      bootstrap.servers: "localhost:9092"
      topic: "webtraffic"